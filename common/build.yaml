build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.21
  amd64: ghcr.io/home-assistant/amd64-base:3.21
  # armv7-base tops out at Alpine 3.21 (Node 22) — the last tag upstream builds.
  # Z2M >=2.7 requires Node ^20/^22/^24, so 3.21 is the minimum viable base and
  # the reason we self-build armv7 (upstream dropped armv7 after 2.6.3-1).
  armv7: ghcr.io/home-assistant/armv7-base:3.21
