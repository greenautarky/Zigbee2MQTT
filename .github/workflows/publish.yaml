name: Build & Push (GHCR) - ga_zigbee2mqtt

# Self-build the Zigbee2MQTT add-on image for GreenAutarky, INCLUDING armv7.
# Upstream (zigbee2mqtt/hassio-zigbee2mqtt) dropped armv7/armhf/i386 after
# 2.6.3-1, which froze the iHost (armv7) fleet. Z2M core still builds fine on
# Node 22 / arm32, so we rebuild the add-on image ourselves and publish it to
# ghcr.io/greenautarky/ga_zigbee2mqtt-{arch}.

on:
  push:
    branches: [ master, "ga-build/**" ]
    paths:
      - "zigbee2mqtt/config.json"
      - "common/**"
      - ".github/workflows/publish.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NS: ghcr.io/greenautarky
  ADDON_SLUG: ga_zigbee2mqtt
  ADDON_DIR: zigbee2mqtt

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 builds NATIVELY on an arm64 runner. Emulating arm64 via
          # qemu-user crashes Node/pnpm with "Illegal instruction (SIGILL,
          # exit 132)" during the Z2M build; a native runner avoids qemu.
          - ha_arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - ha_arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          # armv7 has no native hosted runner, but qemu-arm emulation of the
          # 32-bit build is stable (verified building 2.12.1 successfully).
          - ha_arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver=$(jq -r '.version' "${ADDON_DIR}/config.json")
          if [ -z "${ver}" ] || [ "${ver}" = "null" ]; then
            echo "::error::Could not read version from ${ADDON_DIR}/config.json"
            exit 1
          fi
          echo "Detected add-on version: ${ver}"
          echo "value=${ver}" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        shell: bash
        run: |
          set -euo pipefail
          # The Dockerfile + rootfs live in common/ and are shared by all
          # add-on variants — stage them into the build dir like the upstream CI.
          cp common/Dockerfile "${ADDON_DIR}/Dockerfile"
          cp -R common/rootfs "${ADDON_DIR}/rootfs"

      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NS }}/${{ env.ADDON_SLUG }}-${{ matrix.ha_arch }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Resolve base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          # Single source of truth = common/build.yaml (upstream-style). aarch64
          # and amd64 track upstream's Alpine 3.22; armv7 is our 3.21 divergence.
          img=$(sed -n "s|^[[:space:]]*${{ matrix.ha_arch }}:[[:space:]]*||p" common/build.yaml | head -1)
          if [ -z "${img}" ]; then
            echo "::error::No build_from entry for ${{ matrix.ha_arch }} in common/build.yaml"
            exit 1
          fi
          echo "Base image for ${{ matrix.ha_arch }}: ${img}"
          echo "img=${img}" >> "$GITHUB_OUTPUT"

      - name: Build & Push (${{ matrix.ha_arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.ADDON_DIR }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.img }}
            BUILD_VERSION=${{ steps.ver.outputs.value }}
            BUILD_ARCH=${{ matrix.ha_arch }}
